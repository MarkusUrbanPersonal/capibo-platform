openapi: 3.1.0
info:
  title: Capibo API
  version: '1.0'
  description: |
    Plan data-collection missions, track quality review, and pull accepted
    egocentric videos into your robot-training pipeline.
  contact:
    name: Capibo support
    email: support@capibo.work
servers:
  - url: https://api.capibo.work/v1
    description: Production
security:
  - bearerAuth: []

tags:
  - name: Missions
    description: Create and manage data-collection missions.
  - name: Planning
    description: Price a mission before you launch it.
  - name: Datasets
    description: Accepted videos, grouped per mission.
  - name: Videos
    description: Individual submissions and their quality-review results.
  - name: Exports
    description: Package a dataset into a training format and deliver it.
  - name: Billing
    description: Prepaid credits, transactions and promo codes.
  - name: Usage
    description: Collection volume and spend over time.
  - name: Webhooks
    description: Get notified when videos are accepted, missions finish and more.

paths:
  /missions:
    get:
      tags: [Missions]
      summary: List missions
      operationId: listMissions
      parameters:
        - name: status
          in: query
          description: Only return missions in this state.
          schema: { $ref: '#/components/schemas/MissionStatus' }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of missions, newest first.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Mission' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Missions]
      summary: Create a mission
      description: |
        Creates a mission and dispatches its tasks to collectors in the Capibo
        app. Credits are only charged as videos are accepted. Pass
        `"dispatch": false` to create a draft you can launch later.
      operationId: createMission
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MissionCreate' }
      responses:
        '201':
          description: The created mission.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Mission' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/InsufficientCredits' }

  /missions/estimate:
    post:
      tags: [Planning]
      summary: Estimate a mission
      description: |
        Prices a set of tasks without creating anything: per-task subtotals,
        QA processing for the expected number of submissions, collector pool
        size and delivery time. This is the same estimate the mission planner
        shows before you approve.
      operationId: estimateMission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tasks]
              properties:
                tasks:
                  type: array
                  minItems: 1
                  items: { $ref: '#/components/schemas/TaskInput' }
                regions:
                  type: array
                  items: { $ref: '#/components/schemas/Region' }
                  example: [US, PT, MX]
      responses:
        '200':
          description: The estimate.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Estimate' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /missions/{mission_id}:
    parameters:
      - $ref: '#/components/parameters/MissionId'
    get:
      tags: [Missions]
      summary: Retrieve a mission
      operationId: getMission
      responses:
        '200':
          description: The mission.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Mission' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Missions]
      summary: Update a mission
      description: Pause or resume collection, rename the mission, or raise its target.
      operationId: updateMission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [active, paused]
                  description: '`paused` stops new tasks reaching collectors; videos already recorded still go through QA.'
                name: { type: string }
                target:
                  type: integer
                  minimum: 1
                  description: New accepted-video target. Can't be lower than the videos already accepted.
            example:
              status: paused
      responses:
        '200':
          description: The updated mission.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Mission' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /missions/{mission_id}/stats:
    parameters:
      - $ref: '#/components/parameters/MissionId'
    get:
      tags: [Missions]
      summary: Retrieve mission stats
      description: Daily submission counts by quality outcome, plus per-task acceptance rates.
      operationId: getMissionStats
      parameters:
        - name: range
          in: query
          schema:
            type: string
            enum: [7d, 30d, 90d]
            default: 30d
      responses:
        '200':
          description: Mission stats for the range.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MissionStats' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /datasets:
    get:
      tags: [Datasets]
      summary: List datasets
      operationId: listDatasets
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of datasets.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Dataset' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /datasets/{dataset_id}:
    parameters:
      - $ref: '#/components/parameters/DatasetId'
    get:
      tags: [Datasets]
      summary: Retrieve a dataset
      operationId: getDataset
      responses:
        '200':
          description: The dataset.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dataset' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /datasets/{dataset_id}/videos:
    parameters:
      - $ref: '#/components/parameters/DatasetId'
    get:
      tags: [Datasets]
      summary: List dataset videos
      description: |
        Videos for the dataset's mission, newest first. To sync incrementally,
        store `next_cursor` and pass it back as `cursor`, or pass
        `created_after` with the `created_at` of the last video you processed.
      operationId: listDatasetVideos
      parameters:
        - name: status
          in: query
          description: Defaults to `accepted`, the videos that make up the dataset.
          schema:
            $ref: '#/components/schemas/VideoStatus'
            default: accepted
        - name: task_id
          in: query
          schema: { type: string, example: T-2 }
        - name: created_after
          in: query
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of videos.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Video' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /videos/{video_id}:
    parameters:
      - name: video_id
        in: path
        required: true
        schema: { type: string, example: VID-784210 }
    get:
      tags: [Videos]
      summary: Retrieve a video
      description: Metadata, quality-review checks and a signed download URL (valid for 1 hour).
      operationId: getVideo
      responses:
        '200':
          description: The video.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Video' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /datasets/{dataset_id}/exports:
    parameters:
      - $ref: '#/components/parameters/DatasetId'
    post:
      tags: [Exports]
      summary: Create an export
      description: |
        Packages the dataset's accepted videos and annotations into a training
        format and delivers them. Exports run asynchronously: poll
        `GET /exports/{export_id}` or listen for the `export.ready` webhook.
      operationId: createExport
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExportCreate' }
      responses:
        '202':
          description: The export was queued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Export' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /exports/{export_id}:
    parameters:
      - name: export_id
        in: path
        required: true
        schema: { type: string, example: EXP-20931 }
    get:
      tags: [Exports]
      summary: Retrieve an export
      operationId: getExport
      responses:
        '200':
          description: The export.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Export' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /billing/balance:
    get:
      tags: [Billing]
      summary: Retrieve credit balance
      operationId: getBalance
      responses:
        '200':
          description: The current balance and auto-recharge settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Balance' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /billing/transactions:
    get:
      tags: [Billing]
      summary: List transactions
      description: Credit top-ups, redeemed promo codes and monthly invoices, newest first.
      operationId: listTransactions
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of transactions.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Transaction' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /billing/promo-codes/redeem:
    post:
      tags: [Billing]
      summary: Redeem a promo code
      description: Adds the code's credit to your balance. Each code can be redeemed once per organization.
      operationId: redeemPromoCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  description: Case-insensitive.
                  example: CAL_HACKS
      responses:
        '200':
          description: The code was redeemed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  transaction: { $ref: '#/components/schemas/Transaction' }
                  balance:
                    type: number
                    description: New credit balance in USD.
                    example: 68420.55
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: The code doesn't exist or has expired.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error: { type: not_found, code: promo_code_invalid, message: '"CALHACKS" isn''t a valid promo code.' }
        '409':
          description: The code was already redeemed by this organization.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error: { type: conflict, code: promo_code_redeemed, message: CAL_HACKS has already been redeemed on this account. }

  /usage:
    get:
      tags: [Usage]
      summary: Retrieve usage
      description: Daily submissions, accepted videos and spend, optionally for one mission.
      operationId: getUsage
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date, example: '2026-10-01' }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date, example: '2026-10-24' }
        - name: mission_id
          in: query
          schema: { type: string, example: MSN-1042 }
      responses:
        '200':
          description: Usage for the period.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /webhooks:
    get:
      tags: [Webhooks]
      summary: List webhook endpoints
      operationId: listWebhooks
      responses:
        '200':
          description: Your webhook endpoints.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/WebhookEndpoint' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Webhooks]
      summary: Create a webhook endpoint
      description: The response includes the signing `secret`. It's only returned once, so store it.
      operationId: createWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, events]
              properties:
                url:
                  type: string
                  format: uri
                  example: https://ml.example.com/hooks/capibo
                events:
                  type: array
                  items: { $ref: '#/components/schemas/EventType' }
                  example: [video.accepted, export.ready]
      responses:
        '201':
          description: The created endpoint, with its signing secret.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/WebhookEndpoint'
                  - type: object
                    properties:
                      secret:
                        type: string
                        example: whsec_9f2c4e7a1b...
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /webhooks/{webhook_id}:
    parameters:
      - name: webhook_id
        in: path
        required: true
        schema: { type: string, example: wh_3kd92m }
    delete:
      tags: [Webhooks]
      summary: Delete a webhook endpoint
      operationId: deleteWebhook
      responses:
        '204':
          description: The endpoint was deleted.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

webhooks:
  video.accepted:
    post:
      summary: video.accepted
      description: A video passed quality review and was added to its mission's dataset.
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/EventEnvelope'
                - type: object
                  properties:
                    type: { const: video.accepted }
                    data: { $ref: '#/components/schemas/Video' }
      responses:
        '200': { description: Return any 2xx to acknowledge the event. }
  video.rejected:
    post:
      summary: video.rejected
      description: A video failed quality review. `data.rejection_reason` says why.
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/EventEnvelope'
                - type: object
                  properties:
                    type: { const: video.rejected }
                    data: { $ref: '#/components/schemas/Video' }
      responses:
        '200': { description: Return any 2xx to acknowledge the event. }
  mission.completed:
    post:
      summary: mission.completed
      description: A mission reached its accepted-video target and stopped collecting.
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/EventEnvelope'
                - type: object
                  properties:
                    type: { const: mission.completed }
                    data: { $ref: '#/components/schemas/Mission' }
      responses:
        '200': { description: Return any 2xx to acknowledge the event. }
  export.ready:
    post:
      summary: export.ready
      description: An export finished packaging and is available at `data.url`.
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/EventEnvelope'
                - type: object
                  properties:
                    type: { const: export.ready }
                    data: { $ref: '#/components/schemas/Export' }
      responses:
        '200': { description: Return any 2xx to acknowledge the event. }
  balance.low:
    post:
      summary: balance.low
      description: Your credit balance fell below the auto-recharge threshold.
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/EventEnvelope'
                - type: object
                  properties:
                    type: { const: balance.low }
                    data: { $ref: '#/components/schemas/Balance' }
      responses:
        '200': { description: Return any 2xx to acknowledge the event. }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'An API key from **Settings → API keys**, e.g. `cpb_live_…`.'

  parameters:
    MissionId:
      name: mission_id
      in: path
      required: true
      schema: { type: string, example: MSN-1042 }
    DatasetId:
      name: dataset_id
      in: path
      required: true
      schema: { type: string, example: DS-301 }
    Limit:
      name: limit
      in: query
      description: Page size.
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Cursor:
      name: cursor
      in: query
      description: The `next_cursor` from the previous page.
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: A unique key (e.g. a UUID). Retrying with the same key returns the original response instead of doing the work twice.
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: The request is invalid.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { type: invalid_request, code: parameter_invalid, message: 'tasks[0].videos must be at least 1.', param: 'tasks[0].videos' }
    Unauthorized:
      description: The API key is missing, invalid or revoked.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { type: authentication_error, code: api_key_invalid, message: Invalid API key. }
    NotFound:
      description: The resource doesn't exist or isn't visible to this key.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { type: not_found, code: resource_missing, message: No mission with id MSN-9999. }
    InsufficientCredits:
      description: Your balance doesn't cover the mission's estimated cost.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { type: payment_required, code: insufficient_credits, message: 'Estimated cost $26,412.00 exceeds your balance of $18,420.55.' }

  schemas:
    Page:
      type: object
      required: [data, has_more]
      properties:
        data: { type: array, items: {} }
        has_more: { type: boolean }
        next_cursor:
          type: [string, 'null']
          description: Pass as `cursor` to fetch the next page. `null` on the last page.
          example: eyJpZCI6IlZJRC03ODQxNzUifQ

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [type, code, message]
          properties:
            type:
              type: string
              enum: [invalid_request, authentication_error, permission_denied, not_found, conflict, payment_required, rate_limited, api_error]
            code: { type: string, description: Machine-readable reason. }
            message: { type: string, description: Human-readable explanation. }
            param: { type: string, description: The parameter that caused the error, if any. }

    Region:
      type: string
      description: ISO 3166-1 alpha-2 country code (UK for the United Kingdom).
      enum: [US, CA, MX, BR, UK, DE, ES, PT, PL, IN]

    MissionStatus:
      type: string
      enum: [draft, dispatching, active, paused, completed]

    VideoStatus:
      type: string
      enum: [processing, accepted, rejected]
      description: '`processing` means the video is still in quality review.'

    TaskInput:
      type: object
      required: [name, videos]
      properties:
        name: { type: string, example: Fold t-shirt }
        instructions:
          type: string
          description: Shown to collectors in the Capibo app. Generated from `name` if omitted.
          example: Fold sleeves in, then fold the shirt in thirds lengthwise.
        videos:
          type: integer
          minimum: 1
          description: Accepted videos to collect for this task.
          example: 900
        duration:
          type: array
          description: Target clip length in seconds, `[min, max]`.
          items: { type: integer }
          minItems: 2
          maxItems: 2
          example: [20, 45]
        labels:
          type: array
          items: { type: string }
          example: [t-shirt, fold, two-hand]

    Task:
      allOf:
        - $ref: '#/components/schemas/TaskInput'
        - type: object
          properties:
            id: { type: string, example: T-2 }
            price:
              type: number
              description: USD per accepted video.
              example: 3.19
            accepted: { type: integer, example: 1612 }

    MissionCreate:
      type: object
      required: [name, tasks]
      properties:
        name: { type: string, example: Household laundry folding }
        description:
          type: string
          example: Egocentric videos of people folding everyday garments for a clothes-folding robot policy.
        regions:
          type: array
          items: { $ref: '#/components/schemas/Region' }
          example: [US, PT, MX]
        tasks:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/TaskInput' }
        guidelines:
          type: array
          description: Recording rules applied to every task.
          items: { type: string }
          example:
            - Chest- or head-mounted phone, landscape, 1080p or higher
            - Both hands visible for the whole clip
        dispatch:
          type: boolean
          default: true
          description: Send tasks to collectors immediately. `false` creates a `draft`.

    Mission:
      type: object
      properties:
        id: { type: string, example: MSN-1042 }
        name: { type: string, example: Household laundry folding }
        description: { type: string }
        status: { $ref: '#/components/schemas/MissionStatus' }
        regions:
          type: array
          items: { $ref: '#/components/schemas/Region' }
        target:
          type: integer
          description: Accepted videos to collect across all tasks.
          example: 10000
        accepted: { type: integer, example: 7339 }
        progress:
          type: integer
          description: Percent of target accepted.
          example: 73
        cost:
          type: number
          description: USD charged so far.
          example: 24783.4
        tasks:
          type: array
          items: { $ref: '#/components/schemas/Task' }
        dataset_id:
          type: [string, 'null']
          description: Set once the first video is accepted.
          example: DS-301
        started_at: { type: string, format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }

    Estimate:
      type: object
      properties:
        lines:
          type: array
          items:
            type: object
            properties:
              name: { type: string, example: Fold t-shirt }
              videos: { type: integer, example: 900 }
              price: { type: number, example: 3.19 }
              subtotal: { type: number, example: 2871.0 }
        total_videos: { type: integer, example: 3450 }
        accept_rate:
          type: number
          description: Expected share of submissions that pass QA, from similar missions.
          example: 0.85
        expected_submissions: { type: integer, example: 4059 }
        collection:
          type: number
          description: Sum of task subtotals, USD.
          example: 9591.5
        processing:
          type: number
          description: QA fee ($0.15) × expected submissions, USD.
          example: 608.85
        total: { type: number, example: 10200.35 }
        collectors: { type: integer, example: 363 }
        days:
          type: integer
          description: Estimated days to reach the target.
          example: 11
        hours:
          type: number
          description: Total footage, hours.
          example: 24.3
        balance_covers: { type: boolean, example: true }

    MissionStats:
      type: object
      properties:
        mission_id: { type: string, example: MSN-1042 }
        range: { type: string, example: 30d }
        acceptance_rate: { type: number, example: 0.85 }
        daily:
          type: array
          items:
            type: object
            properties:
              date: { type: string, format: date, example: '2026-10-23' }
              accepted: { type: integer, example: 118 }
              rejected: { type: integer, example: 19 }
              processing: { type: integer, example: 6 }
        tasks:
          type: array
          items:
            type: object
            properties:
              task_id: { type: string, example: T-2 }
              name: { type: string, example: Fold t-shirt }
              share: { type: number, description: Share of the mission's videos., example: 0.22 }
              acceptance_rate: { type: number, example: 0.75 }
              avg_duration: { type: number, description: Seconds., example: 34 }

    Dataset:
      type: object
      properties:
        id: { type: string, example: DS-301 }
        name: { type: string, example: Household laundry folding · v1.2 }
        mission_id: { type: string, example: MSN-1042 }
        version: { type: string, example: v1.2 }
        videos: { type: integer, description: Accepted videos., example: 7339 }
        hours: { type: number, example: 49 }
        avg_quality: { type: integer, example: 90 }
        updated_at: { type: string, format: date-time }

    Video:
      type: object
      properties:
        id: { type: string, example: VID-784210 }
        mission_id: { type: string, example: MSN-1042 }
        dataset_id: { type: [string, 'null'], example: DS-301 }
        task_id: { type: string, example: T-2 }
        task: { type: string, example: Fold t-shirt }
        status: { $ref: '#/components/schemas/VideoStatus' }
        quality:
          type: [integer, 'null']
          description: QA score 0–100. `null` while processing.
          example: 91
        rejection_reason:
          type: [string, 'null']
          example: null
          examples: [Hands leave frame for more than 2s, Insufficient lighting, Motion blur above threshold, Task not completed, Face visible without consent, Camera not egocentric, Duplicate submission]
        duration: { type: number, description: Seconds., example: 34 }
        resolution: { type: string, example: 1920×1080 }
        fps: { type: integer, example: 30 }
        size_mb: { type: number, example: 57.8 }
        device: { type: string, example: iPhone 16 Pro }
        collector_id:
          type: string
          description: Pseudonymous collector ID.
          example: C-58214
        region: { $ref: '#/components/schemas/Region' }
        labels:
          type: array
          items: { type: string }
          example: [t-shirt, fold, two-hand]
        checks:
          type: object
          description: Individual quality-review checks.
          properties:
            hands_in_frame: { type: boolean, example: true }
            lighting: { type: integer, description: 0–100., example: 88 }
            blur: { type: integer, description: 0–100, lower is sharper., example: 6 }
            task_complete: { type: boolean, example: true }
            privacy: { type: boolean, description: No faces or personal data in frame., example: true }
        download_url:
          type: [string, 'null']
          format: uri
          description: Signed MP4 URL, valid for 1 hour. Only on accepted videos.
        annotations_url:
          type: [string, 'null']
          format: uri
          description: Signed JSON annotations URL, valid for 1 hour.
        created_at: { type: string, format: date-time }

    ExportCreate:
      type: object
      required: [format, destination]
      properties:
        format:
          type: string
          enum: [lerobot, rlds, webdataset, mp4-json]
          description: '`lerobot` (Hugging Face LeRobot), `rlds` (RLDS / TFRecord), `webdataset` (.tar shards) or `mp4-json` (MP4 + JSON annotations).'
        destination:
          type: string
          enum: [s3, gcs, hf, link]
          description: A connected integration, or `link` for a signed download link (24h).
        task_ids:
          type: array
          description: Only export these tasks. All tasks by default.
          items: { type: string }
        created_after:
          type: string
          format: date-time
          description: Only export videos accepted after this time, for incremental exports.
        include_rejected:
          type: boolean
          default: false
        blur_faces:
          type: boolean
          default: true
          description: Blur any faces or screens detected in frame.

    Export:
      type: object
      properties:
        id: { type: string, example: EXP-20931 }
        dataset_id: { type: string, example: DS-301 }
        status:
          type: string
          enum: [queued, packaging, ready, failed]
        format: { type: string, example: lerobot }
        destination: { type: string, example: s3 }
        videos: { type: integer, example: 7339 }
        url:
          type: [string, 'null']
          description: Where the export was delivered, once `ready`.
          example: s3://timefactories/datasets/DS-301/v1.2
        created_at: { type: string, format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }

    Balance:
      type: object
      properties:
        balance:
          type: number
          description: Prepaid credits, USD.
          example: 18420.55
        currency: { type: string, example: USD }
        auto_recharge:
          type: object
          properties:
            enabled: { type: boolean, example: false }
            threshold: { type: number, example: 5000 }
            amount: { type: number, example: 25000 }

    Transaction:
      type: object
      properties:
        id: { type: string, example: TXN-81009 }
        kind:
          type: string
          enum: [credit, promo, invoice]
        description: { type: string, example: Promo code CAL_HACKS redeemed }
        amount: { type: number, example: 50000 }
        status:
          type: string
          enum: [succeeded, pending, failed, paid]
        created_at: { type: string, format: date-time }

    Usage:
      type: object
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        totals:
          type: object
          properties:
            submitted: { type: integer, example: 8761 }
            accepted: { type: integer, example: 7450 }
            cost: { type: number, example: 22803.12 }
        daily:
          type: array
          items:
            type: object
            properties:
              date: { type: string, format: date }
              submitted: { type: integer }
              accepted: { type: integer }
              cost: { type: number }

    EventType:
      type: string
      enum: [video.accepted, video.rejected, mission.completed, export.ready, balance.low]

    WebhookEndpoint:
      type: object
      properties:
        id: { type: string, example: wh_3kd92m }
        url: { type: string, format: uri, example: https://ml.example.com/hooks/capibo }
        events:
          type: array
          items: { $ref: '#/components/schemas/EventType' }
        created_at: { type: string, format: date-time }

    EventEnvelope:
      type: object
      required: [id, type, created_at, data]
      properties:
        id:
          type: string
          description: Unique per event. Use it to skip duplicate deliveries.
          example: evt_8hf21k
        type: { $ref: '#/components/schemas/EventType' }
        created_at: { type: string, format: date-time }
        data: { type: object }
